name: CI

# Su main i controlli girano nel workflow Release, prima di pubblicare.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Prisma è un'app Windows: alcuni test usano percorsi Windows (C:\…, file:///C:/…).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Senza DATABASE_URL i test di integrazione con MySQL vengono saltati.
      - run: pnpm test
