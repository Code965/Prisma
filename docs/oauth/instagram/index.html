<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />

    <title>Prisma · ritorno da Instagram</title>
    <link rel="stylesheet" href="../oauth.css" />
  </head>
  <body>
    <main>
      <h1>Ritorno a Prisma…</h1>
      <p>
        Instagram ha completato l’accesso. Questa pagina passa il codice all’app Prisma aperta sul

      </p>
      <p id="manuale" hidden>
        Se non succede nulla, controlla che Prisma sia aperta e
        <a id="link" href="#">torna a Prisma</a>.
      </p>
    </main>
    <script src="../oauth.js" data-platform="instagram"></script>
  </body>
