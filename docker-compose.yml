# MySQL 8 per lo sviluppo locale. Credenziali lette da .env (vedi .env.example).
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-prisma}
      MYSQL_USER: ${MYSQL_USER:-prisma}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?imposta MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?imposta MYSQL_ROOT_PASSWORD in .env}
      TZ: UTC
    command:
      [
        '--default-time-zone=+00:00',
        '--character-set-server=utf8mb4',
        '--collation-server=utf8mb4_0900_ai_ci',
      ]
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
